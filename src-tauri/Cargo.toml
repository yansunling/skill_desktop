[package]
name = "codex-skill-manager"
version = "0.1.1"
description = "Desktop GUI for managing Codex and Claude Code skills"
authors = ["OpenAI Codex"]
license = ""
repository = ""
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.6", features = [ "updater", "process-relaunch", "fs-all", "dialog-open", "path-all"] }
thiserror = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
