name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_PRIVATE_KEY)) {
            throw "GitHub Secret TAURI_PRIVATE_KEY is required to sign updater artifacts."
          }

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "技能管理器 ${{ github.ref_name }}"
          releaseBody: "请查看本版本附带的安装包和自动更新包。"
          releaseDraft: false
          prerelease: false

      - name: Publish updater manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $bundleDirectory = "src-tauri/target/release/bundle/msi"
          $archive = Get-ChildItem $bundleDirectory -Filter "*.msi.zip" | Select-Object -First 1
          if (-not $archive) {
            throw "Updater archive was not generated."
          }

          $signaturePath = "$($archive.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "Updater signature was not generated."
          }

          $releaseDirectory = New-Item -ItemType Directory -Force -Path "release-assets"
          $assetName = "skill-manager_${version}_x64.msi.zip"
          $assetPath = Join-Path $releaseDirectory.FullName $assetName
          $signatureAssetPath = "$assetPath.sig"
          Copy-Item -LiteralPath $archive.FullName -Destination $assetPath
          Copy-Item -LiteralPath $signaturePath -Destination $signatureAssetPath

          $manifest = [ordered]@{
            version = $version
            notes = "Release $env:GITHUB_REF_NAME"
            pub_date = [DateTimeOffset]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content -Raw -LiteralPath $signaturePath).Trim()
                url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$assetName"
              }
            }
          }
          $manifestPath = Join-Path $releaseDirectory.FullName "latest.json"
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding utf8

          gh release upload $env:GITHUB_REF_NAME $assetPath $signatureAssetPath $manifestPath `
            --repo $env:GITHUB_REPOSITORY --clobber
